{% extends 'base.html' %}
{% block title %}Visualização da Simulação{% endblock %}
{% block content %}
<h2>Visualização da Simulação {{ sim.sim_id }}</h2>
<p><b>Modo:</b> {{ sim.mode }} | <b>Dim:</b> {{ sim.dim }} | <b>Shape:</b> {{ sim.shape }}</p>
<div id="main_plot" style="height:520px;"></div>
{% if sim.dim == 3 %}
<div class="row g-2 mb-3">
  <div class="col-md-2"><select id="axis" class="form-select"><option value="0">x</option><option value="1">y</option><option value="2">z</option></select></div>
  <div class="col-md-3"><input id="slice_idx" type="range" class="form-range" min="0" max="{{ sim.shape[2]-1 }}" value="{{ (sim.shape[2]-1)//2 }}"></div>
</div>
<div id="slice_plot" style="height:440px;"></div>
{% endif %}

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script>
const sim = {{ sim_json|safe }};
const tLast = sim.t_snaps[sim.t_snaps.length - 1];
const aLast = sim.alpha_snaps[sim.alpha_snaps.length - 1];

if (sim.dim === 1){
  const x = [...Array(aLast.length).keys()];
  Plotly.newPlot('main_plot', [
    {x, y:aLast, mode:'lines', name:'alpha'},
    {x, y:tLast.map(v=>v-273.15), mode:'lines', name:'T (°C)', yaxis:'y2'}
  ], {title:'Perfil final 1D', yaxis:{title:'α'}, yaxis2:{title:'T (°C)',overlaying:'y',side:'right'}});
} else if (sim.dim === 2){
  Plotly.newPlot('main_plot', [{z:aLast, type:'heatmap', colorbar:{title:'α'}}], {title:'Mapa alpha final 2D'});
} else {
  const nx = aLast.length, ny = aLast[0].length, nz = aLast[0][0].length;
  const x=[], y=[], z=[], val=[];
  for(let i=0;i<nx;i++){for(let j=0;j<ny;j++){for(let k=0;k<nz;k++){x.push(i);y.push(j);z.push(k);val.push(aLast[i][j][k]);}}}
  Plotly.newPlot('main_plot', [{
    type:'volume', x, y, z, value:val, opacity:0.08, surface:{count:12}, caps:{x:{show:false},y:{show:false},z:{show:false}}
  }], {title:'Volume 3D alpha final'});

  function drawSlice(){
    const axis = parseInt(document.getElementById('axis').value);
    const idx = parseInt(document.getElementById('slice_idx').value);
    let slice;
    if(axis===0) slice = aLast[idx];
    if(axis===1) slice = aLast.map(r=>r[idx]);
    if(axis===2) slice = aLast.map(r=>r.map(c=>c[idx]));
    Plotly.newPlot('slice_plot', [{z:slice, type:'heatmap'}], {title:`Slice α eixo ${axis} idx ${idx}`});
  }
  drawSlice();
  document.getElementById('axis').addEventListener('change', drawSlice);
  document.getElementById('slice_idx').addEventListener('input', drawSlice);
}
</script>
{% endblock %}
